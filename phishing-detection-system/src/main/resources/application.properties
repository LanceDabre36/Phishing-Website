# ============================================================
# PhishGuard - Application Configuration
# ============================================================

# --- Server ---
server.port=8080
spring.application.name=PhishGuard

# --- Database (H2 in-memory for demo, MySQL-compatible mode) ---
spring.datasource.url=jdbc:h2:mem:phishguard;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Console (optional, browse to /h2-console)
spring.h2.console.enabled=false

# --- Thymeleaf ---
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# --- Weka ML model location ---
ml.model.path=classpath:dataset/phishguard.model
ml.training.data=classpath:dataset/training.arff

# --- Security (demo credentials; change in production) ---
app.security.admin.username=admin
app.security.admin.password=admin123

# --- Site metadata (used in templates) ---
site.name=PhishGuard
# Set SITE_BASE_URL to the public HTTPS domain when deploying.
site.base-url=${SITE_BASE_URL:http://localhost:8080}
